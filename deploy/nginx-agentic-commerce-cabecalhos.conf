# Cabeçalhos de segurança, instalados em /etc/nginx/snippets/agentic-commerce-cabecalhos.conf.
# Cada location com add_header próprio inclui este arquivo de novo: no nginx, um add_header na location
# descarta os herdados do server.
# CSP: as fontes vêm do Google Fonts (tokens.css do front) e as miniaturas das ofertas, da DummyJSON.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://cdn.dummyjson.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

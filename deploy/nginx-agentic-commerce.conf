server {
    listen 80;
    server_name _;

    root /var/www/agentic-commerce-web;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /opt/agentic-commerce-api/deploy/nginx-seguranca.conf;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
    }

    # O build do Vite põe um hash no nome dos arquivos: cada versão tem nomes novos e pode ficar um ano no cache.
    location /assets/ {
        include /opt/agentic-commerce-api/deploy/nginx-seguranca.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # O index.html aponta para os arquivos da versão atual, então o navegador confere a cada acesso se ele mudou.
    location = /index.html {
        include /opt/agentic-commerce-api/deploy/nginx-seguranca.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Rotas do React (/pedidos, /perfil...) abertas direto na barra devolvem o index.html.
    location / {
        try_files $uri /index.html;
    }
}

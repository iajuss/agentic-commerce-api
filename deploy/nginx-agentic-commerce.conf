server {
    listen 80;
    server_name _;
    server_tokens off;

    # Link para a versão publicada do front; deploy/publicar-front.sh troca o link de uma vez.
    root /var/www/agentic-commerce-web/atual;
    index index.html;

    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include snippets/agentic-commerce-cabecalhos.conf;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
    }

    # O nome tem o hash do conteúdo, então o navegador guarda por um ano. Arquivo inexistente é 404,
    # e não o index.html, que o navegador recusaria como script.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/agentic-commerce-cabecalhos.conf;
    }

    # Rotas do React (/perfil, /pedidos/<id>...) recebem o index.html.
    location / {
        try_files $uri /index.html;
    }

    # O index.html aponta para os arquivos da versão atual: o navegador confere a cada visita.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include snippets/agentic-commerce-cabecalhos.conf;
    }
}
